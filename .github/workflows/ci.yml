name: CI

on:
  push:
    branches: [main]
    # Tags also publish desktop installers and versioned container images.
    tags: ['v*']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          # Scan every revision that would become public, not just the tip.
          fetch-depth: 0

      - name: Scan tracked files
        run: ./scripts/check-secrets.sh

      - name: Scan full history
        run: |
          set -uo pipefail
          fail=0
          # A credential stays in the packfiles even after a force-push, so the whole reachable
          # history has to be clean before this repository goes public. Patterns are anchored to
          # the exact shapes vendors issue, and generated trees are excluded: minified bundles and
          # source maps are identifier soup that a naive "sk-..." regex matches by accident.
          # (apps/desktop/renderer/ was committed early on and later removed; it is build output.)
          pattern='\b(AKIA|ASIA)[0-9A-Z]{16,}|\bLTAI[0-9A-Za-z]{12,24}\b|\bgh[pousr]_[0-9A-Za-z]{36,}\b|\bgithub_pat_[0-9A-Za-z_]{30,}\b|\bglpat-[0-9A-Za-z_-]{20,}|\bxox[baprs]-[0-9A-Za-z-]{15,}\b|\bsk-ant-[0-9A-Za-z_-]{40,}\b|\bsk-proj-[0-9A-Za-z_-]{40,}\b|\bsk-[A-Za-z0-9]{40,}\b|\bAIza[0-9A-Za-z_-]{35,}|-----BEGIN (RSA |EC |DSA |OPENSSH |PGP )?PRIVATE KEY'
          while read -r rev; do
            out=$(git grep -lIE "$pattern" "$rev" -- ':!*.map' ':!*.min.js' ':!pnpm-lock.yaml' ':!apps/desktop/renderer' ':!apps/web/dist' ':!apps/mobile/www' ':!apps/mobile/harmony/entry/src/main/resources/resfile' 2>/dev/null)
            [ -n "$out" ] || continue
            echo "::error::credential-shaped content committed in $rev"
            printf '%s\n' "$out" | head -10
            fail=1
          done < <(git rev-list --all)
          if [ "$fail" -ne 0 ]; then
            echo "Rotate anything real, then scrub history with git filter-repo or BFG." >&2
          else
            echo "history scan: clean ($(git rev-list --all --count) commits)"
          fi
          exit "$fail"

  verify:
    name: Lint, typecheck and test
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: aimarkdown
          POSTGRES_PASSWORD: aimarkdown_test
          POSTGRES_DB: aimarkdown_test
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U aimarkdown -d aimarkdown_test"
          --health-interval 5s --health-timeout 5s --health-retries 20

    env:
      TEST_DATABASE_URL: postgres://aimarkdown:aimarkdown_test@127.0.0.1:5434/aimarkdown_test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.6.5

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: |
          pnpm --filter @aimarkdown/shared build
          pnpm --filter @aimarkdown/markdown build
          pnpm --filter @aimarkdown/server build
          pnpm --filter @aimarkdown/web build

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm -r test:unit

      - name: Integration tests (real Postgres + Hocuspocus)
        run: pnpm --filter @aimarkdown/server test:integration

      - name: Install Playwright browsers
        run: pnpm --filter @aimarkdown/web exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm --filter @aimarkdown/web test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  docker-image:
    name: Build application image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: verify
    permissions:
      contents: read
      # Publishing to GHCR uses the workflow token; no long-lived registry secret is needed.
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Validate compose files
        run: |
          docker compose -f deploy/docker-compose.dev.yml config --quiet
          PUBLIC_URL=example.com POSTGRES_PASSWORD=x JWT_SECRET=0123456789abcdef0123456789abcdef0123 \
            docker compose -f deploy/docker-compose.yml config --quiet

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # main -> :main + :latest, tag v1.2.3 -> :v1.2.3 + :1.2.3; every build also gets :sha-xxxxxxx.
      # Pull requests only build (with the same cache) and never publish.
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  desktop:
    name: Package desktop clients
    runs-on: ${{ matrix.os }}
    needs: verify
    # Only publish installers for tagged releases.
    if: startsWith(github.ref, 'refs/tags/')
    strategy:
      matrix:
        include:
          - os: macos-13
            args: --mac --x64
          - os: macos-14
            args: --mac --arm64
          - os: windows-latest
            args: --win --x64
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.6.5

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build renderer and shell
        run: |
          pnpm --filter @aimarkdown/shared build
          pnpm --filter @aimarkdown/markdown build
          pnpm --filter @aimarkdown/desktop build

      # Unsigned: see README for the Gatekeeper / SmartScreen notes.
      - name: Package
        run: pnpm --filter @aimarkdown/desktop exec electron-builder ${{ matrix.args }}

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.exe
          if-no-files-found: warn
