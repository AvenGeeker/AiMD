ext {
    // Pinned to the Android Studio generation that supports up to AGP 8.7.3 (compileSdk 35).
    // Upgrading to a newer Studio? Bump AGP in android/build.gradle, restore compileSdk/
    // targetSdk 36 and the newer androidx versions, then delete these two override comments.
    // This file is generated by `cap add android`; a fresh `cap add` would restore the
    // template values, so re-apply these pins after regenerating.
    minSdkVersion = 24
    compileSdkVersion = 35
    targetSdkVersion = 35
    androidxActivityVersion = '1.10.1'
    androidxAppCompatVersion = '1.7.1'
    androidxCoordinatorLayoutVersion = '1.3.0'
    androidxCoreVersion = '1.15.0'
    androidxFragmentVersion = '1.8.9'
    coreSplashScreenVersion = '1.2.0'
    androidxWebkitVersion = '1.14.0'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.3.0'
    androidxEspressoCoreVersion = '3.7.0'
    cordovaAndroidVersion = '14.0.1'
}