packages:
  - 'apps/*'
  - 'packages/*'

# pnpm 10 blocks dependency postinstall scripts by default. These are the only ones we need:
#   esbuild          – downloads its platform binary (required by tsx/vite/vitest)
#   @node-rs/argon2  – selects the prebuilt NAPI binary for the host platform
#   electron         – downloads the Electron binary for desktop builds
onlyBuiltDependencies:
  - esbuild
  - '@node-rs/argon2'
  - electron
